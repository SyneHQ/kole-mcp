name: Publish to NPM

# Every push to sudo bumps the patch version, publishes via npm trusted
# publishing (OIDC, no token) and tags + releases the bumped commit.
on:
  push:
    branches: [sudo]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    # Release commits are pushed with GITHUB_TOKEN, which never re-triggers
    # workflows; this guard only covers pushes made with a personal token.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    environment: prod # must match the npm trusted publisher config
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version bump

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # trusted publishing needs npm >= 11.5.1
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - name: Check build artifacts
        run: test -f dist/index.js && test -f dist/index.d.ts

      - name: Bump patch version
        id: version
        run: |
          # Start from the highest of package.json, the registry and git tags.
          tagged=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1 | sed 's/^v//')
          published=$(npm view "$(node -p 'require("./package.json").name')" version 2>/dev/null || echo 0.0.0)
          local=$(node -p 'require("./package.json").version')
          base=$(printf '%s\n' "$published" "$local" "${tagged:-0.0.0}" | sort -V | tail -1)
          npm version "$base" --no-git-tag-version --allow-same-version --ignore-scripts
          npm version patch --no-git-tag-version --ignore-scripts
          echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - run: npm publish --provenance --access public

      - name: Commit, tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $TAG"
          git tag "$TAG"
          git push origin HEAD:sudo "$TAG"
          gh release create "$TAG" --generate-notes
